<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  :root{
    --paper:#f5f2ec; --sheet:#fffdf8; --ink:#17140f; --ink2:#4a443b; --ink3:#7b7365;
    --rule:#dcd5c7; --signal:#b4491f; --cool:#3c5763;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --serif:ui-serif,Georgia,"Iowan Old Style",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1080px;background:var(--paper);color:var(--ink);overflow:hidden;
       position:relative;font-family:var(--serif)}
  .grid{position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,var(--rule) 0 1px,transparent 1px 26px),
               repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 26px);
    opacity:.9;
    -webkit-mask-image:radial-gradient(120% 95% at 4% -6%,#000 0%,rgba(0,0,0,.5) 42%,transparent 82%)}
  .pad{position:relative;padding:84px}
  .mark{font-family:var(--mono);font-size:15px;letter-spacing:.24em;text-transform:uppercase;
        color:var(--ink3)}
  h1{font-weight:500;font-size:60px;line-height:1.12;letter-spacing:-.022em;margin-top:28px;max-width:17ch}
  h1 em{font-style:normal;color:var(--ink2)}
  h1 br+em{display:inline}
  .cards{display:flex;flex-direction:column;gap:16px;margin-top:64px}
  .c{width:100%;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--cool);
     padding:18px 20px 20px}
  .c.g{border-top-color:var(--signal)}
  .c .t{font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
        color:var(--ink);font-weight:600}
  .c .s{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
        color:var(--cool);margin-top:5px}
  .c.g .s{color:var(--signal)}
  .c .d{font-size:19px;color:var(--ink2);margin-top:13px;line-height:1.35;font-family:var(--serif)}
  .foot{position:absolute;left:84px;bottom:76px;font-family:var(--mono);font-size:17px;
        letter-spacing:.15em;text-transform:uppercase;color:var(--signal)}
</style></head>
<body>
  <div class="grid"></div>
  <div class="pad">
    <div class="mark">Map My Folder</div>
    <h1>A map of your folder,<br><em>for the reader<br>with no memory.</em></h1>
    <div class="cards">
      <div class="c"><div class="t">Engine</div><div class="s">Live</div>
        <div class="d">hits every instance</div></div>
      <div class="c"><div class="t">Blueprint</div><div class="s">Live</div>
        <div class="d">future copies only</div></div>
      <div class="c g"><div class="t">Instruction</div><div class="s">Live → Ghost</div>
        <div class="d">aims at a path that never existed</div></div>
    </div>
  </div>
  <div class="foot">catalog → one card → stop</div>
</body></html>
